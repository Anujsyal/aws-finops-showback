name: Python CI

on:
  pull_request:
    paths: ["lambdas/**", "tests/**", ".github/workflows/python-ci.yml"]
  push:
    branches: [main]
    paths: ["lambdas/**", "tests/**", ".github/workflows/python-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 pytest ruff
      - name: Lint
        run: ruff check lambdas tests --line-length 120
      - name: Unit tests
        run: pytest -q tests
