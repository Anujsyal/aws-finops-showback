name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", "lambdas/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", "lambdas/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  id-token: write      # required for GitHub OIDC -> AWS
  contents: read
  pull-requests: write # to comment the plan on the PR

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

defaults:
  run:
    shell: bash # enables pipefail, so a failed plan still fails the step
    working-directory: terraform

jobs:
  plan:
    name: fmt / validate / plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=finops-showback/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"

      - name: terraform validate
        run: terraform validate

      - name: Policy-as-code scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true # report only; flip to false to block merges
          quiet: true

      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "### Terraform plan\n```\n" + plan + "\n```",
            });

  apply:
    name: apply (needs approval)
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment in repo settings
    # to get a manual approval gate before anything is applied.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=finops-showback/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"

      - name: terraform apply
        run: terraform apply -input=false -auto-approve
